name: 问题报告
description: 报告可重复出现的错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: 实际发生了什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 原本应该怎样
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现
      description: 不要粘贴真实聊天、令牌或其他敏感信息。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响
      description: 是否造成漏记、重复、错误对外动作或隐私风险？
    validations:
      required: true

