name: 新能力
description: 提出一项可验收的产品或工程能力
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先描述使用者遇到什么问题，不要先写技术方案。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 用户能够看到的结果
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收场景
      description: 用具体例子说明什么情况算完成。
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 边界确认
      options:
        - label: 本能力不会让系统自动执行业务任务
          required: true
        - label: 所有对外可见动作仍由系统主人确认
          required: true

