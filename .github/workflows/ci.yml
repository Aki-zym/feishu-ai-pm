name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build Cindy thin plugin
        run: npm run build:plugin
      - name: Typecheck
        run: npm run typecheck
      - name: Plugin tests
        run: npm run test:plugin
      - name: Web tests
        run: npm run test:web:current
      - name: Server intake, runtime, seed, logs and app tests
        run: npm run test:server:current
