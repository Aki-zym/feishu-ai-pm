appId: com.guanchen.feishu-ai-pm
productName: 数据 PM
copyright: Copyright © 2026
asar: true
# npm install 已提供与项目版本一致的 Electron 运行时。打包时直接使用
# 本地副本，避免构建过程再次联网下载并因短暂网络中断失败。
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - apps/desktop/dist/**
  - apps/web/dist/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Feishu-AI-PM-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
